<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2540;--navy-mid:#1a3a5c;--gold:#c8923a;--gold-light:#e8b060;
  --cream:#faf8f5;--white:#fff;--text:#1a1a2e;--text-muted:#5a6a7a;
  --border:#dde3ea;--success:#1a7a4a;--success-bg:#e8f5ee;
  --danger:#8a1a1a;--danger-bg:#fde8e8;
  --shadow-lg:0 8px 40px rgba(15,37,64,.14);--radius-lg:16px;
}
body{
  font-family:'DM Sans',sans-serif;background:var(--navy);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;color:var(--text);font-size:14px;line-height:1.6;
}
.auth-box{
  background:var(--white);border-radius:var(--radius-lg);
  padding:40px 36px;width:100%;max-width:400px;
  box-shadow:var(--shadow-lg);animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo .icon{
  width:52px;height:52px;background:var(--gold);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;margin:0 auto 12px;
}
.auth-logo h1{font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy)}
.auth-logo p{font-size:12px;color:var(--text-muted);margin-top:3px}
.panel{display:none;flex-direction:column;gap:14px}
.panel.active{display:flex}
label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:-8px}
input[type=email],input[type=password],input[type=text]{
  font-family:'DM Sans',sans-serif;font-size:14px;
  padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;
  color:var(--text);background:var(--cream);outline:none;
  transition:border-color .18s;width:100%;
}
input:focus{border-color:var(--navy);background:var(--white)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-toggle{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:16px;
  color:var(--text-muted);padding:0;line-height:1;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:11px;width:100%;border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;border:none;transition:all .18s;
}
.btn-primary{background:var(--navy);color:var(--white)}
.btn-primary:hover{background:var(--navy-mid)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-text{background:none;color:var(--text-muted);font-size:12px;text-decoration:underline;padding:4px;width:auto;margin:0 auto}
.btn-text:hover{color:var(--navy)}
.msg{font-size:12.5px;padding:8px 12px;border-radius:8px;display:none}
.msg.show{display:block}
.msg.error{color:var(--danger);background:var(--danger-bg)}
.msg.success{color:var(--success);background:var(--success-bg)}
.back-link{margin-top:16px;text-align:center;font-size:12px;color:rgba(255,255,255,.45)}
.back-link a{color:rgba(255,255,255,.7);text-decoration:underline}
.back-link a:hover{color:#fff}
</style>
</head>

    <h1>Ditshwanelo Botswana</h1>
    <p>Case Management System</p>
  </div>

  <!-- PANEL 1: Request reset link -->
  <div class="panel active" id="panel-request">
    <div style="text-align:center;margin-bottom:4px">
      <div style="font-size:30px;margin-bottom:6px">📧</div>
      <div style="font-family:'DM Serif Display',serif;font-size:18px;color:var(--navy)">Reset your password</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-top:4px">Enter your email and we'll send a reset link</div>
    </div>
    <label>Email address</label>
    <input type="email" id="req-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')sendReset()">
    <div class="msg error" id="req-error"></div>
    <div class="msg success" id="req-success"></div>
    <button class="btn btn-primary" id="req-btn" onclick="sendReset()">Send reset link →</button>
    <button class="btn btn-text" onclick="goBack()">← Back to sign in</button>
  </div>

  <!-- PANEL 2: Set new password -->
  <div class="panel" id="panel-newpass">
    <div style="text-align:center;margin-bottom:4px">
      <div style="font-size:30px;margin-bottom:6px">🔐</div>
      <div style="font-family:'DM Serif Display',serif;font-size:18px;color:var(--navy)">Set new password</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-top:4px">Choose a strong password for your account</div>
    </div>
    <label>New password</label>
    <div class="pw-wrap">
      <input type="password" id="np-1" placeholder="Min 6 characters">
      <button type="button" class="pw-toggle" onclick="togglePw('np-1',this)">👁</button>
    </div>
    <label>Confirm password</label>
    <div class="pw-wrap">
      <input type="password" id="np-2" placeholder="Repeat new password" onkeydown="if(event.key==='Enter')setNewPassword()">
      <button type="button" class="pw-toggle" onclick="togglePw('np-2',this)">👁</button>
    </div>
    <div class="msg error" id="np-error"></div>
    <div class="msg success" id="np-success"></div>
    <button class="btn btn-primary" id="np-btn" onclick="setNewPassword()">Update password →</button>
  </div>

  <!-- PANEL 3: Done -->
  <div class="panel" id="panel-done">
    <div style="text-align:center;padding:10px 0 6px">
      <div style="font-size:40px;margin-bottom:10px">✅</div>
      <div style="font-family:'DM Serif Display',serif;font-size:18px;color:var(--navy);margin-bottom:6px">Password updated!</div>
      <div style="font-size:13px;color:var(--text-muted)">You can now sign in with your new password.</div>
    </div>
    <button class="btn btn-primary" onclick="goBack()">Go to sign in →</button>
  </div>
</div>

<div class="back-link">
  <a href="index.html">← Return to Ditshwanelo Case System</a>
</div>

<script>
const SB_CREDS_KEY = 'legalaid_sb_creds_v3';
const _ck = 'legalaid_v3_secure';
function _xor(str, key){ return str.split('').map((c,i)=>String.fromCharCode(c.charCodeAt(0)^key.charCodeAt(i%key.length))).join(''); }
function _dec(str){ try{ return _xor(atob(str),_ck); }catch(e){ return ''; } }

// Hardcoded fallback — safe, anon key is public
const FALLBACK_URL = 'https://rsfpqgctxuiawcoglede.supabase.co';
const FALLBACK_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzZnBxZ2N0eHVpYXdjb2dsZWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwOTg0OTUsImV4cCI6MjA4OTY3NDQ5NX0.CIYKlTRCylwVIup217CfYyGT8Sp_62IpqoXc1sQEDRM';
const PROD_RESET_URL = 'https://ditshwanelo.vercel.app/reset-password.html';

let sbClient = null;

function loadCreds(){
  try{
    const r = localStorage.getItem(SB_CREDS_KEY);
    if(!r) return null;
    const obj = JSON.parse(r);
    if(obj.u && obj.k) return { url: _dec(obj.u), key: _dec(obj.k) };
    if(obj.url && obj.key) return obj;
  }catch(e){}
  return null;
}

function initClient(){
  try {
    const { createClient } = supabase;
    // Try localStorage credentials first
    const creds = loadCreds();
    if(creds && creds.url && creds.key){
      sbClient = createClient(creds.url, creds.key);
    } else {
      // Fall back to hardcoded
      sbClient = createClient(FALLBACK_URL, FALLBACK_KEY);
    }
    return true;
  } catch(e) {
    console.warn('initClient failed:', e.message);
    return false;
  }
}

function getRedirectUrl(){
  const proto = window.location.protocol;
  const host = window.location.host;
  // file:// or no real host → use production URL
  if(proto === 'file:' || !host){
    return PROD_RESET_URL;
  }
  // localhost or 127.0.0.1 → use local URL
  if(host.includes('localhost') || host.includes('127.0.0.1')){
    return `${proto}//${host}/reset-password.html`;
  }
  // Production or any other host → use current page URL
  return window.location.href.split('?')[0].split('#')[0];
}

function showPanel(name){
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
}

function showErr(id, msg){ const el=document.getElementById(id); el.textContent=msg; el.className='msg error show'; }
function showOk(id, msg){ const el=document.getElementById(id); el.textContent=msg; el.className='msg success show'; }
function clearMsg(id){ const el=document.getElementById(id); el.className='msg'; }

function togglePw(id, btn){
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

async function sendReset(){
  const email = document.getElementById('req-email').value.trim();
  clearMsg('req-error'); clearMsg('req-success');
  if(!email){ showErr('req-error','Please enter your email address'); return; }
  if(!sbClient){ showErr('req-error','Connection error. Please refresh and try again.'); return; }
  const btn = document.getElementById('req-btn');
  btn.textContent = 'Sending…'; btn.disabled = true;
  try{
    const redirectTo = getRedirectUrl();
    console.log('Redirecting to:', redirectTo); // debug
    const { error } = await sbClient.auth.resetPasswordForEmail(email, { redirectTo });
    if(error) throw error;
    showOk('req-success', '✓ Reset link sent! Check your inbox (and spam folder).');
    document.getElementById('req-email').value = '';
  }catch(e){
    showErr('req-error', e.message || 'Failed to send reset email');
  }finally{
    btn.textContent = 'Send reset link →'; btn.disabled = false;
  }
}

async function setNewPassword(){
  const p1 = document.getElementById('np-1').value;
  const p2 = document.getElementById('np-2').value;
  clearMsg('np-error'); clearMsg('np-success');
  if(p1.length < 6){ showErr('np-error','Password must be at least 6 characters'); return; }
  if(p1 !== p2){ showErr('np-error','Passwords do not match'); return; }
  if(!sbClient){ showErr('np-error','Session expired. Please request a new reset link.'); return; }
  const btn = document.getElementById('np-btn');
  btn.textContent = 'Updating…'; btn.disabled = true;
  try{
    const { error } = await sbClient.auth.updateUser({ password: p1 });
    if(error) throw error;
    document.getElementById('np-1').value = '';
    document.getElementById('np-2').value = '';
    showPanel('done');
    history.replaceState(null, '', window.location.pathname);
  }catch(e){
    showErr('np-error', e.message || 'Failed to update password');
  }finally{
    btn.textContent = 'Update password →'; btn.disabled = false;
  }
}

function goBack(){
  window.location.href = 'index.html';
}

(async function init(){
  // Always init client first
  if(!initClient()){
    showErr('req-error', 'Could not connect to server. Please refresh.');
    showPanel('request');
    return;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');

  const hash = window.location.hash;
  const hashParams = new URLSearchParams(hash.replace('#', ''));
  const type = hashParams.get('type');
  const accessToken = hashParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token');

  // Path 1: PKCE code flow (modern Supabase default)
  if(code){
    try{
      const { error } = await sbClient.auth.exchangeCodeForSession(code);
      if(error) throw error;
      showPanel('newpass');
      history.replaceState(null, '', window.location.pathname);
      return;
    }catch(e){
      console.warn('Code exchange failed:', e.message);
      showErr('req-error', 'Link expired or invalid. Please request a new one.');
      showPanel('request');
      return;
    }
  }

  // Path 2: Implicit/hash token flow (older Supabase)
  if(type === 'recovery' && accessToken){
    try{
      const { error } = await sbClient.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
      if(error) throw error;
      showPanel('newpass');
      history.replaceState(null, '', window.location.pathname);
      return;
    }catch(e){
      console.warn('Hash session failed:', e.message);
      showErr('req-error', 'Link expired or invalid. Please request a new one.');
      showPanel('request');
      return;
    }
  }

  // Path 3: Already have an active session (user refreshed the page)
  try{
    const { data: { session } } = await sbClient.auth.getSession();
    if(session){
      showPanel('newpass');
      return;
    }
  }catch(e){
    console.warn('getSession failed:', e.message);
  }

  // Default: show request form
  showPanel('request');
})();
</script>
